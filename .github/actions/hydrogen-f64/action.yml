name: Checked hydrogen F64 build input
description: Deterministically generate the bounded native evaluator and check the application path
runs:
  using: composite
  steps:
    - name: Generate and check native hydrogen input
      shell: python
      run: |
        import hashlib
        from pathlib import Path
        import subprocess

        root = Path.cwd()
        output = root / "build/generated"
        output.mkdir(parents=True, exist_ok=True)
        source = "tools/generate/hydrogen/sage"
        image = "sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea"
        subprocess.run(["docker", "pull", image], check=True)
        docker = ["docker", "run", "--rm", "-e", "PYTHONHASHSEED=0", "-v", f"{root}:/work:ro",
                  "-w", "/work", image, "sage", "-python"]
        for script, name in [
            ("export_polar_f64.py", "hydrogen_spdf_f64.h"),
            ("export_polar_f64_receipts.py", "polar_f64_receipts.tsv"),
            ("export_viewer_receipts.py", "viewer_receipts.tsv"),
        ]:
            first = subprocess.check_output(docker + [f"{source}/{script}"])
            second = subprocess.check_output(docker + [f"{source}/{script}"])
            if first != second:
                import difflib
                print("".join(difflib.unified_diff(first.decode().splitlines(True),
                    second.decode().splitlines(True), fromfile="first", tofile="second")))
                raise RuntimeError(f"non-deterministic generation: {script}")
            (output / name).write_bytes(first)
        header = (output / "hydrogen_spdf_f64.h").read_text()
        if any(text in header for text in ["hypot", "atan2", ".real", ".imaginary"]):
            raise RuntimeError("rectangular complex machinery in generated evaluator")
        flags = ["cc", "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-pedantic",
                 "-I", str(output), "-I", "android/native"]
        subprocess.run(flags + [f"{source}/check_polar_f64_runtime.c", "-lm", "-o",
                               str(output / "check_polar_f64_runtime")], check=True)
        subprocess.run([str(output / "check_polar_f64_runtime"),
                        str(output / "polar_f64_receipts.tsv")], check=True)
        application_sources = ["check_hydrogen_renderer.c", "pauli_orbital.c",
            "pauli_volume_image.c", "pauli_color.c", "pauli_renderer_orbitals.c"]
        subprocess.run(flags + [f"android/native/{name}" for name in application_sources]
                       + ["-lm", "-o", str(output / "check_hydrogen_renderer")], check=True)
        subprocess.run([str(output / "check_hydrogen_renderer"),
                        str(output / "polar_f64_receipts.tsv"),
                        str(output / "viewer_receipts.tsv")], check=True)
        files = sorted(Path(source).rglob("*.py"))
        (output / "sources.sha256").write_text("".join(
            f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path}\n" for path in files
        ))
        subprocess.run(["docker", "image", "inspect", image, "--format", "{{json .RepoDigests}}"],
                       check=True, stdout=(output / "sage-image.txt").open("w"))
        subprocess.run(["git", "rev-parse", "HEAD"], check=True,
                       stdout=(output / "source.commit").open("w"))
