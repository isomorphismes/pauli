name: Idriç ray tracer

concurrency:
  group: idric-raytracer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact Pauli source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: 94dfd99bd3e376507fedc8611053b7173b2519f0
          path: .idric-toolchain
          persist-credentials: false

      - name: Restore pinned Idriç bootstrap
        id: idric-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .idric-toolchain/_/.tools
            .idric-toolchain/_/bootstrap-build
            .idric-toolchain/_/build
            .idric-toolchain/_/libs/prelude/build
            .idric-toolchain/_/libs/base/build
            .idric-toolchain/_/libs/linear/build
            .idric-toolchain/_/libs/network/build
            .idric-toolchain/_/libs/contrib/build
            .idric-toolchain/_/libs/test/build
            .idric-toolchain/_/libs/papers/build
          key: idric-linux-94dfd99bd3e376507fedc8611053b7173b2519f0

      - name: Bootstrap pinned Idriç
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: ./.idric-toolchain/edric bootstrap

      - name: Save pinned Idriç bootstrap
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .idric-toolchain/_/.tools
            .idric-toolchain/_/bootstrap-build
            .idric-toolchain/_/build
            .idric-toolchain/_/libs/prelude/build
            .idric-toolchain/_/libs/base/build
            .idric-toolchain/_/libs/linear/build
            .idric-toolchain/_/libs/network/build
            .idric-toolchain/_/libs/contrib/build
            .idric-toolchain/_/libs/test/build
            .idric-toolchain/_/libs/papers/build
          key: idric-linux-94dfd99bd3e376507fedc8611053b7173b2519f0

      - name: Typecheck executable through Idriç handoff
        run: |
          ./.idric-toolchain/edric --emit-one-step \
            "$GITHUB_WORKSPACE/raytracer/RayTracer.idric" \
            -o "$RUNNER_TEMP/raytracer.anf"

      - name: Run Idriç ray tracer
        run: |
          support_root="$GITHUB_WORKSPACE/.idric-toolchain/_"
          compiler="$support_root/build/exec/idris2"
          library_path="$support_root/libs/prelude/build/ttc:$support_root/libs/base/build/ttc:$support_root/libs/linear/build/ttc:$support_root/libs/network/build/ttc:$support_root/libs/contrib/build/ttc:$support_root/libs/test/build/ttc:"
          cd "$GITHUB_WORKSPACE/raytracer"
          PATH="$support_root/.tools/bin:$PATH" \
          IDRIS2_PREFIX="$support_root/bootstrap-build" \
          IDRIS2_PATH="$library_path" \
            "$compiler" --exec main RayTracer.idric \
              > "$RUNNER_TEMP/pauli-raytracer.ppm"

      - name: Inspect rendered PPM frame
        run: |
          test "$(sed -n '1p' "$RUNNER_TEMP/pauli-raytracer.ppm")" = "P3"
          test "$(sed -n '2p' "$RUNNER_TEMP/pauli-raytracer.ppm")" = "64 48"
          test "$(sed -n '3p' "$RUNNER_TEMP/pauli-raytracer.ppm")" = "255"
          pixel_count=$(tail -n +4 "$RUNNER_TEMP/pauli-raytracer.ppm" | wc -l)
          test "$pixel_count" -eq 3072
          distinct_pixels=$(tail -n +4 "$RUNNER_TEMP/pauli-raytracer.ppm" | sort -u | wc -l)
          test "$distinct_pixels" -gt 8
          printf 'pixels=%s distinct=%s\n' "$pixel_count" "$distinct_pixels"

      - name: Retain rendered frame
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pauli-idric-raytracer-frame
          path: ${{ runner.temp }}/pauli-raytracer.ppm
          if-no-files-found: error
