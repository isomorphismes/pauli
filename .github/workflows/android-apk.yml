name: Android APK smoke

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out Pauli
        uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build inputs
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"

      - name: Build one-ABI native-only APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ANDROID_COMPILE_SDK: "36"
          PAULI_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
          PAULI_KEYSTORE_TYPE: PKCS12
          PAULI_KEY_ALIAS: wegert-debug
          PAULI_STORE_PASSWORD: wegert-debug
          PAULI_KEY_PASSWORD: wegert-debug
          PAULI_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
        run: |
          set -Eeuo pipefail

          for abi in armeabi-v7a arm64-v8a x86_64; do
            ANDROID_ABI="$abi"               bash android/build-native.sh               "build/android/$abi/libpauli.so"

            ANDROID_ABI="$abi"               bash android/build-apk.sh               "build/android/$abi/libpauli.so"               "build/android/pauli-$abi.apk"

            unzip -l "build/android/pauli-$abi.apk"               > "build/android/pauli-$abi.contents.txt"

            grep -Fq "lib/$abi/libpauli.so"               "build/android/pauli-$abi.contents.txt"

            ! grep -Fq "classes.dex"               "build/android/pauli-$abi.contents.txt"

            for other in armeabi-v7a arm64-v8a x86 x86_64; do
              if [[ $other != "$abi" ]]; then
                ! grep -Fq "lib/$other/"                   "build/android/pauli-$abi.contents.txt"
              fi
            done
          done

      - name: Exercise DEX-free native viewer shell on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: sh android/emulator-smoke.sh

      - name: Retain installable APKs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pauli-android-native-only
          path: |
            build/android/pauli-armeabi-v7a.apk
            build/android/pauli-arm64-v8a.apk
            build/android/pauli-x86_64.apk
            build/android/pauli-*.contents.txt
            build/android/pauli-*.signing.tsv
            build/android/*/libpauli.so
            build/android/emulator.log
            build/android/emulator.png
          if-no-files-found: warn
