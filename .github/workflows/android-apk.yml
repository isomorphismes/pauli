name: Android APK smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  apk-smoke:
    needs: compilers
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Pauli
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out the qualified stage interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .ai-ci-ick
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pauli-ick-*
          path: .ick-toolchains
          merge-multiple: true
      - name: Restore the three installed C frontends
        run: make -f scripts/ick-toolchains.mk restore

      - name: Generate checked native hydrogen input
        uses: ./.github/actions/hydrogen-f64

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Check out central signing policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: f0cc1a0473422aa5562911beb8a30baa2f6cb49c
          path: .signing-policy
          sparse-checkout: android-signing/identities.tsv
          sparse-checkout-cone-mode: false

      - name: Load registered Pauli test signer
        shell: bash
        run: |
          set -Eeuo pipefail
          registry=.signing-policy/android-signing/identities.tsv
          signer=$(
            awk -F '\t' \
              '$1 == "org.isomorphisms.pauli" && $2 == "test" { print $3 }' \
              "$registry"
          )
          count=$(printf '%s\n' "$signer" | sed '/^$/d' | wc -l)
          [[ $count -eq 1 ]] || {
            echo "Pauli test signer registry entry count is $count" >&2
            exit 1
          }
          printf 'PAULI_EXPECTED_CERT_SHA256=%s\n' "$signer" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android build inputs
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"

      - name: Build one-ABI native-only APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ANDROID_COMPILE_SDK: "36"
          PAULI_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
          PAULI_KEYSTORE_TYPE: PKCS12
          PAULI_KEY_ALIAS: wegert-debug
          PAULI_STORE_PASSWORD: wegert-debug
          PAULI_KEY_PASSWORD: wegert-debug
        run: |
          set -Eeuo pipefail

          for abi in armeabi-v7a arm64-v8a x86_64; do
            ICK_ROOT="$PWD/build/ick/$abi" ANDROID_ABI="$abi"               bash android/build-native.sh               "build/android/$abi/libpauli.so"

            ANDROID_ABI="$abi"               bash android/build-apk.sh               "build/android/$abi/libpauli.so"               "build/android/pauli-$abi.apk"

            unzip -l "build/android/pauli-$abi.apk"               > "build/android/pauli-$abi.contents.txt"

            grep -Fq "lib/$abi/libpauli.so"               "build/android/pauli-$abi.contents.txt"

            ! grep -Fq "classes.dex"               "build/android/pauli-$abi.contents.txt"

            for other in armeabi-v7a arm64-v8a x86 x86_64; do
              if [[ $other != "$abi" ]]; then
                ! grep -Fq "lib/$other/"                   "build/android/pauli-$abi.contents.txt"
              fi
            done
          done

      - name: Verify phone APK signer
        uses: isomorphisms/ai-ci/android-signing@f0cc1a0473422aa5562911beb8a30baa2f6cb49c
        with:
          apk: build/android/pauli-armeabi-v7a.apk
          lane: test

      - name: Verify tablet APK signer
        uses: isomorphisms/ai-ci/android-signing@f0cc1a0473422aa5562911beb8a30baa2f6cb49c
        with:
          apk: build/android/pauli-arm64-v8a.apk
          lane: test

      - name: Verify emulator APK signer
        uses: isomorphisms/ai-ci/android-signing@f0cc1a0473422aa5562911beb8a30baa2f6cb49c
        with:
          apk: build/android/pauli-x86_64.apk
          lane: test

      - name: Enable hosted emulator KVM access
        run: sudo chmod a+rw /dev/kvm

      - name: Exercise DEX-free native viewer shell on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: sh android/emulator-smoke.sh

      - name: Publish verified APKs and signing receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pauli-android-native-only
          path: |
            build/android/pauli-armeabi-v7a.apk
            build/android/pauli-arm64-v8a.apk
            build/android/pauli-x86_64.apk
            build/android/pauli-*.contents.txt
            build/android/pauli-*.signing.tsv
            build/android/*/libpauli.so
          if-no-files-found: error

      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pauli-android-emulator-evidence
          path: |
            build/android/emulator.log
            build/android/emulator.png
          if-no-files-found: warn
