name: Android APK smoke

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out Pauli
        uses: actions/checkout@v4

      - name: Check out pinned DEX backend
        uses: actions/checkout@v4
        with:
          repository: dilapidated-shed/idric-arm-thumb
          ref: 33ae2f65a7cc8cf711171bf44543369cd95fce54
          path: _deps/idric-arm-thumb
          persist-credentials: false

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@v4
        with:
          repository: dilapidated-shed/Idric
          ref: 51e3892d4de59943e42e65c60a9814aba792c5d4
          path: _deps/Idric
          persist-credentials: false

      - name: Install Idriç host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             bash build-essential ca-certificates chezscheme curl             default-jre-headless file libgmp-dev python3 zip

      - name: Build pinned Idriç compiler and DEX backend
        shell: bash
        run: |
          set -Eeuo pipefail

          compiler_root="$GITHUB_WORKSPACE/_deps/Idric/_"
          compiler="$compiler_root/build/exec/idris2"
          backend="$GITHUB_WORKSPACE/_deps/idric-arm-thumb"

          "$compiler_root/edric" bootstrap
          "$compiler" --version

          make -C "$compiler_root/support/chez"             install IDRIS2_VERSION=0.8.0
          make -C "$compiler_root"             install-bootstrap-libs IDRIS2="$compiler"
          make -C "$compiler_root"             install-api IDRIS2_BOOT="$compiler"

          make -C "$backend" check driver             IDRIC="$compiler"             IDRIC_REPO="$GITHUB_WORKSPACE/_deps/Idric"             IDRIC_COMPILER_REF=51e3892d4de59943e42e65c60a9814aba792c5d4

          {
            echo "IDRIC=$compiler"
            echo "IDRIC_DEX_REPO=$backend"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build inputs
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"

      - name: Generate direct DEX shell
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
        run: bash android/build-dex.sh

      - name: Build APKs for phone, tablet, and emulator
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ANDROID_COMPILE_SDK: "36"
        run: |
          set -Eeuo pipefail

          for abi in armeabi-v7a arm64-v8a x86_64; do
            ANDROID_ABI="$abi"               bash android/build-native.sh               "build/android/$abi/libpauli.so"

            ANDROID_ABI="$abi"               bash android/build-apk.sh               build/android/classes.dex               "build/android/$abi/libpauli.so"               "build/android/pauli-$abi.apk"
          done

      - name: Exercise direct DEX + native shell on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -Eeuo pipefail

            apk=build/android/pauli-x86_64.apk
            package=org.isomorphisms.pauli
            component="$package/.PauliActivity"
            log=build/android/emulator.log

            adb install -r "$apk"
            adb logcat -c
            adb shell am start -S -W -n "$component"

            timeout 20 bash -c               'until adb logcat -d | grep -Fq "PauliNative: EGL surface ready:"; do sleep 1; done'
            timeout 20 bash -c               'until adb logcat -d | grep -Fq "PauliNative: frame presented"; do sleep 1; done'

            adb shell input swipe 250 600 700 600 500
            adb shell input tap 500 800
            sleep 2

            adb logcat -d > "$log"
            adb exec-out screencap -p > build/android/emulator.png

            adb shell pidof -s "$package" |
              tr -d '\r' |
              grep -Eq '^[0-9]+$'

            grep -Fq 'PauliNative: native entry' "$log"
            grep -Fq 'PauliNative: EGL surface ready:' "$log"
            grep -Fq 'PauliNative: frame presented' "$log"
            grep -Fq 'PauliNative: drag:' "$log"
            grep -Fq 'PauliNative: tap: cycle orbital' "$log"

            ! grep -Eiq               'FATAL EXCEPTION|UnsatisfiedLinkError|VerifyError|ClassNotFoundException'               "$log"

      - name: Retain installable APKs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pauli-android-smoke
          path: |
            build/android/classes.dex
            build/android/pauli-armeabi-v7a.apk
            build/android/pauli-arm64-v8a.apk
            build/android/pauli-x86_64.apk
            build/android/*/libpauli.so
            build/android/emulator.log
            build/android/emulator.png
          if-no-files-found: warn
