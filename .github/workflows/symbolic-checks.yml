name: hydrogen checks

on:
  pull_request:
    paths:
      - "hydrogen.html"
      - "hydrogen.ipynb"
      - "books.html"
      - "books/**"
      - "tools/generate/hydrogen/**"
      - "runtime/**"
      - ".github/workflows/symbolic-checks.yml"
  push:
    branches:
      - main
    paths:
      - "hydrogen.html"
      - "hydrogen.ipynb"
      - "books.html"
      - "books/**"
      - "tools/generate/hydrogen/**"
      - "runtime/**"
      - ".github/workflows/symbolic-checks.yml"

jobs:
  hydrogen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull Sage image
        run: docker pull sagemath/sagemath:10.8

      - name: Exact state checks
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            sagemath/sagemath:10.8 \
            sage -python tools/generate/hydrogen/sage/check_hydrogen_states.py

      - name: Independent SymPy checks
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            sagemath/sagemath:10.8 \
            sage -python tools/generate/hydrogen/sage/check_with_sympy.py

      - name: Verify generated public HTML
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            sagemath/sagemath:10.8 \
            sage -python tools/generate/hydrogen/sage/update_public.py --check

      - name: Execute notebook code cells
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            sagemath/sagemath:10.8 \
            sage -python tools/generate/hydrogen/sage/check_notebook.py

      - name: Generate polar Complex F64 evaluator
        run: |
          mkdir -p "$RUNNER_TEMP/pauli-generated"

          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            sagemath/sagemath:10.8 \
            sage -python tools/generate/hydrogen/sage/export_polar_f64.py \
            > "$RUNNER_TEMP/pauli-generated/hydrogen_spdf_f64.h"

          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            sagemath/sagemath:10.8 \
            sage -python tools/generate/hydrogen/sage/export_polar_f64_receipts.py \
            > "$RUNNER_TEMP/pauli-generated/polar_f64_receipts.tsv"

      - name: Reject rectangular complex runtime machinery
        run: |
          if grep -Eq \
            '(hypot|atan2|\.real|\.imaginary)' \
            "$RUNNER_TEMP/pauli-generated/hydrogen_spdf_f64.h"
          then
            echo "generated runtime evaluator contains rectangular complex machinery" >&2
            exit 1
          fi

      - name: Check polar Complex F64 evaluator
        run: |
          cc \
            -std=c99 \
            -O2 \
            -Wall \
            -Wextra \
            -pedantic \
            -I "$RUNNER_TEMP/pauli-generated" \
            tools/generate/hydrogen/sage/check_polar_f64_runtime.c \
            -lm \
            -o "$RUNNER_TEMP/pauli-generated/check_polar_f64_runtime"

          "$RUNNER_TEMP/pauli-generated/check_polar_f64_runtime" \
            "$RUNNER_TEMP/pauli-generated/polar_f64_receipts.tsv"
