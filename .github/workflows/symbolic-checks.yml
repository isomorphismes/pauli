name: hydrogen checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hydrogen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Pull Sage image
        run: docker pull sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea

      - name: Exact state checks
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea \
            sage -python tools/generate/hydrogen/sage/check_hydrogen_states.py

      - name: Independent SymPy checks
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea \
            sage -python tools/generate/hydrogen/sage/check_with_sympy.py

      - name: Verify generated public HTML
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea \
            sage -python tools/generate/hydrogen/sage/update_public.py --check

      - name: Execute notebook code cells
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea \
            sage -python tools/generate/hydrogen/sage/check_notebook.py

      - name: Generate and check application hydrogen input
        uses: ./.github/actions/hydrogen-f64

      - name: Retain checked input and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pauli-checked-hydrogen
          path: build/generated/
          if-no-files-found: error
