name: Android native shell

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-shell.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-shell.yml"

jobs:
  native-smoke:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n android/build-dex.sh
          bash -n android/build-native.sh
          bash -n android/build-apk.sh
          bash -n android/build.sh

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Build native smoke library for release ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          set -eu

          for abi in armeabi-v7a arm64-v8a x86_64; do
            ANDROID_ABI="$abi"               bash android/build-native.sh               "build/android/$abi/libpauli.so"
          done

      - name: Retain native smoke libraries
        uses: actions/upload-artifact@v4
        with:
          name: pauli-native-smoke
          path: build/android/*/libpauli.so
